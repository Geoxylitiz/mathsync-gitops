apiVersion: apps/v1
kind: Deployment
metadata:
  name: mathsync-api
  namespace: mathsync
spec:
  replicas: 2

  selector:
    matchLabels:
      app: mathsync-api

  template:
    metadata:
      labels:
        app: mathsync-api

    spec:
      containers:
        - name: mathsync-api
          image: 480582412269.dkr.ecr.ap-southeast-1.amazonaws.com/mathsync-backend:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 5500

          envFrom:
            - secretRef:
                name: mathsync-secret

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5500
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 5500
            initialDelaySeconds: 20
            periodSeconds: 10